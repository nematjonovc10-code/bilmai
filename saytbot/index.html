<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>SaytBot — AI sayt yaratuvchi</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f4f6ff;font-family:system-ui,Arial,sans-serif}
header{text-align:center;padding:28px 16px 22px;background:linear-gradient(135deg,#172554,#312e81)}.logo{font-size:30px;font-weight:800;color:#c4b5fd}header p{color:#dbeafe;margin:8px 0 0}
main{max-width:900px;margin:auto;padding:18px}.card{background:#141d32;border:1px solid #293654;border-radius:16px;padding:18px;margin-bottom:16px}
h2{font-size:19px;margin:0 0 14px}label{display:block;font-weight:650;margin:12px 0 8px}
textarea{width:100%;min-height:125px;background:#0a1121;color:#f4f6ff;border:1px solid #3a4868;border-radius:10px;padding:13px;font:inherit}
button{border:0;border-radius:10px;padding:12px 15px;background:#7c73ff;color:white;font-weight:750;font-size:15px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}.primary{width:100%;margin-top:12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#preview{width:100%;height:390px;border:0;border-radius:10px;background:white}#code{height:280px;min-height:200px;font-family:monospace;font-size:12px;color:#b9f6ca}
.note{font-size:13px;color:#b6c3df;line-height:1.5}#status{white-space:pre-wrap;font-size:14px;color:#c7d2fe}
@media(min-width:700px){main{padding:24px}.card{padding:22px}}
</style>
</head>
<body>
<header><div class="logo">⚡ SaytBot AI</div><p>G‘oyangni yoz. AI HTML sayt yaratadi.</p></header>
<main>
<section class="card">
<h2>🚀 Yangi sayt yaratish</h2>
<label for="idea">Qanday sayt kerak?</label>
<textarea id="idea" maxlength="2000" placeholder="Masalan: Barcelona haqida chiroyli, mobil telefonga mos sayt yarat. Tarkib, ranglar va bo‘limlarni qo‘sh."></textarea>
<button class="primary" id="generate">✨ AI bilan sayt yaratish</button>
<p class="note">AI server orqali ishlaydi. API kaliti sahifada saqlanmaydi. Bepul xizmat limitlari qo‘llanadi.</p>
<p id="status" aria-live="polite"></p>
</section>
<section class="card">
<h2>👀 Sayt ko‘rinishi</h2>
<iframe id="preview" title="Yaratilgan sayt ko‘rinishi" sandbox="allow-scripts"></iframe>
</section>
<section class="card">
<h2>💻 HTML kodi</h2>
<textarea id="code" readonly placeholder="AI yaratgan kod shu yerda chiqadi"></textarea>
<div class="row"><button id="copy">📋 Kodni nusxalash</button><button id="download">⬇️ HTML yuklash</button></div>
</section>
</main>
<script>
const API_URL = "https://saytbot-ai.nematjonovc10.workers.dev/";
let latestCode = "";
const statusBox = document.getElementById("status");
document.getElementById("generate").addEventListener("click", async () => {
  const idea = document.getElementById("idea").value.trim();
  const btn = document.getElementById("generate");
  if (!idea) { statusBox.textContent = "Avval qanday sayt kerakligini yoz."; return; }
  btn.disabled = true; btn.textContent = "⏳ AI sayt yaratyapti...";
  statusBox.textContent = "So‘rov yuborilmoqda...";
  try {
    const res = await fetch(API_URL, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({idea})});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "So‘rov bajarilmadi.");
    latestCode = String(data.code || "");
    document.getElementById("code").value = latestCode;
    document.getElementById("preview").srcdoc = latestCode;
    statusBox.textContent = "✅ Sayt yaratildi! Kodni nusxalash yoki HTML fayl sifatida saqlash mumkin.";
  } catch (err) {
    statusBox.textContent = "⚠️ " + (err.message || "Serverga ulanib bo‘lmadi.");
  } finally {
    btn.disabled = false; btn.textContent = "✨ AI bilan sayt yaratish";
  }
});
document.getElementById("copy").addEventListener("click", async () => {
  if (!latestCode) { statusBox.textContent = "Avval AI bilan sayt yarat."; return; }
  const box = document.getElementById("code");
  try { await navigator.clipboard.writeText(latestCode); statusBox.textContent = "✅ Kod nusxalandi."; }
  catch { box.focus(); box.select(); statusBox.textContent = "Kod belgilandi. Copy/Nusxalash tugmasini tanla."; }
});
document.getElementById("download").addEventListener("click", () => {
  if (!latestCode) { statusBox.textContent = "Avval AI bilan sayt yarat."; return; }
  const url = URL.createObjectURL(new Blob([latestCode], {type:"text/html;charset=utf-8"}));
  const a = document.createElement("a"); a.href = url; a.download = "saytbot-sayt.html"; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
</script>
</body>
</html>
